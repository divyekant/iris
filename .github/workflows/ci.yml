# Full CI: every area of starter.json, on each release PR into main and by hand.
# Feature PRs do not run this job: local CI ran their tests (see proof-check.yml).
# release.yml merges a release PR only when the check `ci` is green.
name: ci
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The runner image has rustup (stable), node and python3.
      # rust-toolchain.toml selects the toolchain and its components.
      # Ubuntu 24.04 lets a program without an AppArmor profile make a user
      # namespace, but with no capabilities in it. Then the read-only overlay
      # of a read path folder (iris-session) fails with EACCES. Iris needs the
      # overlay (README.md, read paths), so the runner permits it.
      - name: Permit an overlay in a user namespace
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Probe the nested read path test
        run: |
          uname -a; cat /etc/os-release | head -2; bwrap --version; ls -l "$(command -v bwrap)"
          sudo apt-get install -y strace >/dev/null 2>&1 || true
          cargo test -p iris-session --lib --no-run 2>&1 | tail -2
          B=$(cargo test -p iris-session --lib --no-run --message-format=json 2>/dev/null | python3 -c "import sys,json;[print(m['executable']) for m in map(json.loads,sys.stdin) if m.get('executable')]")
          for i in 1 2 3; do $B isolation::linux::tests::read_paths_in_read_paths --test-threads 1 2>&1 | tail -8; done
          strace -f -s 200 -e trace=mount,move_mount,fsopen,fsconfig,fsmount,open_tree,unshare,write,openat -e signal=none -o /tmp/st $B isolation::linux::tests::read_paths_in_read_paths --test-threads 1 2>&1 | tail -5
          grep -E 'bwrap|= -1|move_mount|fsmount|unshare|write\(2' /tmp/st | grep -v ENOENT | head -150
