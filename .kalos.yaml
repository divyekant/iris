version: 0.2.0
extends: minimal

tokens:
  colors:
    primary: "#a394ff"
    neutral: "slate"
    semantic:
      success: "#5fd38d"
      warning: "#f2b84b"
      error: "#f47c7c"
      info: "#a394ff"
  typography:
    font_family: "Inter, system-ui, sans-serif"
    mono_font_family: "'SF Mono', 'Cascadia Mono', 'Menlo', monospace"
    scale: "1.25"
    base_size: 16
  spacing:
    base: 4
    scale: [0, 1, 2, 3, 4, 6, 8, 12, 16, 24, 32]
  radii:
    none: 0
    sm: 4
    md: 8
    lg: 12
    full: 9999

rules:
  colors:
    max_unique: 12
    require_semantic: true
  typography:
    max_font_families: 3
    require_scale: true
  spacing:
    require_base_unit: true
  accessibility:
    min_contrast: 4.5
    require_alt_text: true

brands:
  active: "dark"
  palettes:
    dark:
      colors:
        primary: "#a394ff"
        background: "#0e0f14"
        background_elevated: "#15161d"
        background_surface: "#1c1e27"
        text: "#e7e8ee"
        text_muted: "#a4a7b5"
        text_faint: "#8c8fa0"
        border: "#2c2e3b"
        border_subtle: "rgba(255,255,255,0.06)"
        success: "#5fd38d"
        warning: "#f2b84b"
        error: "#f47c7c"
        info: "#a394ff"
        unread: "#a394ff"
        on_primary: "#0e0f14"
      typography:
        font_family: "Inter, system-ui, sans-serif"
    light:
      colors:
        primary: "#5b47d6"
        background: "#f7f7fa"
        background_elevated: "#ffffff"
        background_surface: "#eeeef4"
        text: "#1b1c24"
        text_muted: "#555867"
        text_faint: "#62657a"
        border: "#dcdde6"
        border_subtle: "rgba(0,0,0,0.06)"
        success: "#15703a"
        warning: "#b7750c"
        error: "#c0262d"
        info: "#5b47d6"
        unread: "#5b47d6"
        on_primary: "#ffffff"
      typography:
        font_family: "Inter, system-ui, sans-serif"
