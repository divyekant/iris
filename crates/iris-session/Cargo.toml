[package]
name = "iris-session"
description = "The session of an Iris job: the launcher, the hold helper and the egress proxy of an agent."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The test isolation, for the tests of other crates. The program never
# enables it.
test-isolation = []

[dependencies]
iris-job = { version = "0.0.0", path = "../iris-job" }
iris-store = { version = "0.0.0", path = "../iris-store" }
iris-workspace = { version = "0.0.0", path = "../iris-workspace" }
rusqlite = "=0.43.0"
serde = { version = "1", features = ["derive"] }
# Already in Cargo.lock. Reads the info line of bwrap.
serde_json = "1"
toml = { version = "=0.9.8", default-features = false, features = ["std", "parse", "serde"] }
# Already in Cargo.lock (through hyper). Parses the CONNECT request head.
httparse = "=1.10.1"
# Already in Cargo.lock. poll() for the accept loop of the egress proxy.
libc = "=0.2.191"
# Already in Cargo.lock. The label of the launchd job of a macOS session.
sha2 = { version = "=0.11.1", default-features = false }
# Already in Cargo.lock (through tokio). Binds the session address of the
# relay before the connect (egress::connect_from).
socket2 = "=0.6.5"
# Already in Cargo.lock (through ureq). Parses the TLS ClientHello of a
# tunnel, to check its server name. No handshake: the proxy reads only the
# first message.
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
# Already in Cargo.lock. Encodes the expected Proxy-Authorization value of a
# session token (macOS egress).
base64 = "=0.23.1"

# The launch tests run their own main: the test program is also the hold
# helper of each session that it launches.
[[test]]
name = "launch"
harness = false

[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.6"
