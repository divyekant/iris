[package]
name = "iris-session"
description = "The session of an Iris job: the launcher, the hold helper and the egress proxy of an agent."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The test isolation, for the tests of other crates. The program never
# enables it.
test-isolation = []

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "=0.9.8", default-features = false, features = ["std", "parse", "serde"] }
# Already in Cargo.lock (through hyper). Parses the CONNECT request head.
httparse = "=1.10.1"
# Already in Cargo.lock. poll() for the accept loop of the egress proxy.
libc = "=0.2.191"
# Already in Cargo.lock (through ureq). Parses the TLS ClientHello of a
# tunnel, to check its server name. No handshake: the proxy reads only the
# first message.
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
