[package]
name = "iris-api"
description = "The local API of Iris: read-only JSON for the web client and the read verbs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
futures-util = { version = "0.3", default-features = false }
iris-store = { version = "0.0.0", path = "../iris-store" }
rusqlite = "=0.43.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
iris-synth = { version = "0.0.0", path = "../iris-synth" }
rusqlite = "=0.43.0"
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
