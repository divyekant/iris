[package]
name = "iris-api"
description = "The local API of Iris: JSON for the web client and the read verbs, the policy changes and the state verbs of the web client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
getrandom = "=0.4.3"
futures-util = { version = "0.3", default-features = false }
iris-apply = { version = "0.0.0", path = "../iris-apply" }
iris-changeset = { version = "0.0.0", path = "../iris-changeset" }
iris-compose = { version = "0.0.0", path = "../iris-compose" }
iris-job = { version = "0.0.0", path = "../iris-job" }
iris-matters = { version = "0.0.0", path = "../iris-matters" }
iris-policy = { version = "0.0.0", path = "../iris-policy" }
iris-senders = { version = "0.0.0", path = "../iris-senders" }
iris-store = { version = "0.0.0", path = "../iris-store" }
iris-triage = { version = "0.0.0", path = "../iris-triage" }
iris-understand = { version = "0.0.0", path = "../iris-understand" }
iris-voice = { version = "0.0.0", path = "../iris-voice" }
iris-workspace = { version = "0.0.0", path = "../iris-workspace" }
rusqlite = "=0.43.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }

[dev-dependencies]
jiff = { version = "=1.0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-concatenated"] }
iris-model = { version = "0.0.0", path = "../iris-model" }
iris-spec = { version = "0.0.0", path = "../iris-spec" }
iris-observe = { version = "0.0.0", path = "../iris-observe" }
iris-web = { version = "0.0.0", path = "../iris-web" }
iris-synth = { version = "0.0.0", path = "../iris-synth" }
rusqlite = "=0.43.0"
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
