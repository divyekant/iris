[package]
name = "iris"
description = "The Iris engine and the iris command, in one program."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "iris"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# Already in the build through ureq: the URL parser of local model URLs.
http = "1"
clap = { version = "4", features = ["derive"] }
iris-api = { version = "0.0.0", path = "../iris-api" }
iris-apply = { version = "0.0.0", path = "../iris-apply" }
iris-service = { version = "0.0.0", path = "../iris-service" }
iris-auth = { version = "0.0.0", path = "../iris-auth" }
iris-gmail = { version = "0.0.0", path = "../iris-gmail" }
iris-model = { version = "0.0.0", path = "../iris-model" }
iris-policy = { version = "0.0.0", path = "../iris-policy" }
iris-store = { version = "0.0.0", path = "../iris-store" }
iris-sync = { version = "0.0.0", path = "../iris-sync" }
iris-changeset = { version = "0.0.0", path = "../iris-changeset" }
iris-triage = { version = "0.0.0", path = "../iris-triage" }
iris-understand = { version = "0.0.0", path = "../iris-understand" }
iris-web = { version = "0.0.0", path = "../iris-web" }
# Same version as iris-store, so the program has one copy of SQLite.
rusqlite = "=0.43.0"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", default-features = false, features = ["rt", "net", "macros", "signal", "io-util", "time", "sync"] }

[dev-dependencies]
iris-fakegmail = { version = "0.0.0", path = "../iris-fakegmail" }
iris-synth = { version = "0.0.0", path = "../iris-synth" }
