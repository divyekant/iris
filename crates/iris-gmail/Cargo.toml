[package]
name = "iris-gmail"
description = "A thin Gmail API v1 client for the Iris mirror: paging, backoff, quota and a streamed raw fetch."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Sync client with rustls (ring), no OpenSSL. The model layer (iris-model) uses the same client.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
iris-fakegmail = { version = "0.0.0", path = "../iris-fakegmail" }
iris-synth = { version = "0.0.0", path = "../iris-synth" }
