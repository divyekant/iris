[package]
name = "iris-sync"
description = "The sync of the Iris mirror: first sync, incremental sync and full resync of a mailbox."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
iris-provider = { version = "0.0.0", path = "../iris-provider" }
iris-store = { version = "0.0.0", path = "../iris-store" }
rusqlite = "=0.43.0"
sha2 = { version = "=0.11.1", default-features = false }

[dev-dependencies]
iris-gmail = { version = "0.0.0", path = "../iris-gmail" }
iris-fakegmail = { version = "0.0.0", path = "../iris-fakegmail" }
iris-fakegraph = { version = "0.0.0", path = "../iris-fakegraph" }
iris-graph = { version = "0.0.0", path = "../iris-graph" }
iris-synth = { version = "0.0.0", path = "../iris-synth" }
