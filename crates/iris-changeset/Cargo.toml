[package]
name = "iris-changeset"
description = "The changeset of Iris: the data format, the store rows and the states of each action."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
iris-compose = { version = "0.0.0", path = "../iris-compose" }
iris-job = { version = "0.0.0", path = "../iris-job" }
iris-store = { version = "0.0.0", path = "../iris-store" }
iris-talk = { version = "0.0.0", path = "../iris-talk" }
iris-understand = { version = "0.0.0", path = "../iris-understand" }
iris-workspace = { version = "0.0.0", path = "../iris-workspace" }
# Same version as iris-store, so the program has one copy of SQLite.
rusqlite = "=0.43.0"
serde_json = "1"
sha2 = { version = "=0.11.1", default-features = false }
unicase = "=2.8.1"

[dev-dependencies]
iris-spec = { version = "0.0.0", path = "../iris-spec" }
