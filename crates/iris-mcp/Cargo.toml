[package]
name = "iris-mcp"
description = "The MCP (Model Context Protocol) server of Iris: one tool for each verb of the iris command, on standard input and output."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The official Rust SDK of MCP. Only the server and the stdio transport.
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "transport-io"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "io-std"] }
