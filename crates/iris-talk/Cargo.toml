[package]
name = "iris-talk"
description = "Make the conversation of one mail thread (specification 1, sections 6.3 and 7.3)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
iris-clean = { version = "0.0.0", path = "../iris-clean" }
iris-people = { version = "0.0.0", path = "../iris-people" }
iris-store = { version = "0.0.0", path = "../iris-store" }
# Same version as iris-store, so the program has one copy of SQLite.
rusqlite = "=0.43.0"
serde_json = "1"

[dev-dependencies]
iris-synth = { path = "../iris-synth" }
# The schemas are test data only, as in iris-spec.
jsonschema = { version = "=0.61.2", default-features = false }
