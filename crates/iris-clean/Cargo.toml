[package]
name = "iris-clean"
description = "Make the clean text of one raw mail message. Pure functions, no network, no model."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aes = { version = "=0.9.4", default-features = false }
encoding_rs = "0.8"
md-5 = { version = "=0.11.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
miniz_oxide = "0.9"
mail-parser = { version = "=1.0.1", default-features = false, features = ["full_encoding"] }

[dev-dependencies]
miniz_oxide = "0.9"
mail-parser = { version = "=1.0.1", default-features = false, features = ["full_encoding"] }
iris-synth = { path = "../iris-synth" }
