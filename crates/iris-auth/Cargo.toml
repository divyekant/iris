[package]
name = "iris-auth"
description = "Google sign-in for Iris: the client file of the user, the loopback redirect with PKCE, the token exchange and the token refresh."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
form_urlencoded = "1"
# Same versions as iris-store, so the program has one copy of each.
getrandom = "=0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "=0.11.1", default-features = false }
# Same HTTP client as iris-gmail and iris-model.
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
