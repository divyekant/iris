[package]
name = "iris-store"
description = "The Iris store: the data folder, the SQLite database with full-text search, the content folder and the secrets."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
getrandom = "=0.4.3"
rusqlite = { version = "=0.43.0", features = ["bundled"] }
sha2 = { version = "=0.11.1", default-features = false }

[dev-dependencies]
iris-synth = { path = "../iris-synth" }
