[package]
name = "iris-matters"
description = "Matters of Iris: the proposals of a matter, and the confirm and the decline of the person."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
iris-model = { version = "0.0.0", path = "../iris-model" }
iris-store = { version = "0.0.0", path = "../iris-store" }
iris-understand = { version = "0.0.0", path = "../iris-understand" }
# Same version as iris-store, so the program has one copy of SQLite.
rusqlite = "=0.43.0"
serde_json = "1"
sha2 = { version = "=0.11.1", default-features = false }

[dev-dependencies]
serde_json = "1"
