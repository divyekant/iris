[package]
name = "iris-understand"
description = "Understanding: turn one mail message into items of the five forms, with fixed rules first and the model second."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
idna = "=1.1.0"
idna_adapter = "=1.1.0"
iris-clean = { version = "0.0.0", path = "../iris-clean" }
iris-model = { version = "0.0.0", path = "../iris-model" }
iris-senders = { version = "0.0.0", path = "../iris-senders" }
iris-store = { version = "0.0.0", path = "../iris-store" }
iris-talk = { version = "0.0.0", path = "../iris-talk" }
jsonschema = { version = "=0.61.2", default-features = false }
# Same version as iris-store, so the program has one copy of SQLite.
rusqlite = "=0.43.0"
serde_json = "1"
url = "=2.5.4"
unicode-normalization = "=0.1.26"
unicode-general-category = "=1.1.0"

[dev-dependencies]
iris-eval = { version = "0.0.0", path = "../iris-eval" }
iris-synth = { version = "0.0.0", path = "../iris-synth" }
