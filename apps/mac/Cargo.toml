[package]
name = "iris-mac"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "The Mac app of Iris: a window and a menu bar icon for the local engine."

# Not a member of the engine workspace: the app has its own lock file, so the
# engine build and the engine CI never compile Tauri.
[workspace]

[dependencies]
serde_json = "=1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
mac-notification-sys = "=0.6.15"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[profile.release]
# The smallest program: memory and disk come first.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
